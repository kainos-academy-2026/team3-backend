name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

env:
  # Single place to change when a "prod" pipeline/environment is added later.
  ENVIRONMENT: dev

# A push to a branch with an open PR fires BOTH a `push` event and a
# `pull_request: synchronize` event for the same commit, so this workflow
# would otherwise run twice at once (wasting runner minutes and causing the
# terraform job to race for the same remote state lock). This cancels the
# older, now-stale run for the same branch/PR whenever a newer one starts.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --exclude "**/*.integration.test.ts"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.alpine
          push: false
          tags: team3-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  push-to-acr:
    name: Push Image to ACR (main only)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      - name: Log in to ACR
        run: az acr login --name acraiacademy26
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.alpine
          push: true
          tags: |
            acraiacademy26.azurecr.io/team3-backend:${{ env.ENVIRONMENT }}-${{ github.sha }}
            acraiacademy26.azurecr.io/team3-backend:${{ env.ENVIRONMENT }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    needs: [build, push-to-acr]
    # push-to-acr only runs on main (see its own `if:` condition), so on
    # branch/PR runs it will show as "skipped" rather than "success" or
    # "failure". `always()` stops that skip from cascading and skipping
    # this job too — we still explicitly require `build` to have passed,
    # and either push-to-acr succeeded (main) or was skipped (branch/PR).
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.push-to-acr.result == 'success' || needs.push-to-acr.result == 'skipped')
    defaults:
      run:
        working-directory: infrastructure
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Can't reference the top-level `env.ENVIRONMENT` here — GitHub Actions
      # doesn't allow the `env` context inside a job's own `env:` block (only
      # inside `steps:`). Keep this in sync with `env.ENVIRONMENT` above.
      TF_VAR_environment: dev
      TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}
      TF_VAR_allowed_ip_addresses: ${{ vars.ALLOWED_IP_ADDRESSES }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform init
        # backend-dev.hcl supplies the actual state location for the "dev"
        # environment. A future "prod" pipeline would use backend-prod.hcl
        # here instead — backend.tf itself never needs to change.
        run: terraform init -input=false -backend-config=backend-dev.hcl
      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: infrastructure/tfplan
      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan

  migrate:
    name: Run Prisma Migrations
    runs-on: ubuntu-latest
    needs: terraform
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy