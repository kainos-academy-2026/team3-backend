name: CI

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --exclude "**/*.integration.test.ts"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: team3-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max